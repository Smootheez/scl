name: Publishing Mod

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Artifacts
          path: build/libs/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: Artifacts
          path: build/libs/

      - name: Get mod version
        id: get_version
        run: |
          # Extract version from the JAR filename
          MOD_VERSION=$(ls build/libs/ | grep -v "sources\|dev" | grep "\.jar$" | sed -E 's/.*-([0-9]+\.[0-9]+\.[0-9]+)\.jar$/\1/')
          echo "version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "JAR found with version $MOD_VERSION"

      - name: Find main JAR file
        id: find_jar
        run: |
          JAR_FILE=$(ls build/libs/ | grep -v "sources\|dev" | grep "\.jar$" | head -n 1)
          echo "jar_file=build/libs/$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found JAR file: $JAR_FILE"

      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          file_path: ${{ steps.find_jar.outputs.jar_file }}
          game_endpoint: minecraft
          game_versions: ${{ vars.MINECRAFT_VERSIONS }}  # Set this in your repo variables
          project_id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          release_type: release  # Can be alpha, beta, or release
          changelog: ${{ github.event.release.body }}
          display_name: "Smootheez Config Lib-${{ steps.get_version.outputs.version }}"
          changelog_type: markdown

      - name: Upload to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          files: ${{ steps.find_jar.outputs.jar_file }}
          version-type: release  # Can be alpha, beta, or release
          version-name: "Smootheez Config Lib-${{ steps.get_version.outputs.version }}"
          version-number: ${{ steps.get_version.outputs.version }}
          changelog: ${{ github.event.release.body }}

          loaders: fabric
          game-versions: ${{ vars.MINECRAFT_VERSIONS }}  # Set this in your repo variables
          java: 17