name: Publishing Mod

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

      - name: Get mod version
        id: get_version
        run: |
          # Extract version from the tag filename
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Find main JAR file
        id: find_jar
        run: |
          JAR_FILE=$(ls build/libs/ | grep -v "sources\|dev" | grep "\.jar$" | head -n 1)
          echo "jar_file=build/libs/$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found JAR file: $JAR_FILE"

      - name: Upload Mod
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: zLVNfWvA
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          curseforge-id: 1107934
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: ${{ steps.find_jar.outputs.jar_file }}
          name: "Smootheez Config Lib ${{ steps.get_version.outputs.version }}"
          version-type: release  # Can be alpha, beta, or release
          version-number: ${{ steps.get_version.outputs.version }}
          changelog: ${{ github.event.release.body }}

          loaders: fabric
          game-versions: |
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
          java: 17